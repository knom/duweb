name: Release Container

on:
  push:
    tags:
      - "v*.*"

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match required format vX.Y or vX.Y.Z"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Run unified checks
        run: npm run check

      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Assemble release bundle
        run: |
          mkdir -p release/server release/client-dist
          cp -R server/dist release/server/dist
          cp -R server/node_modules release/server/node_modules
          cp server/package.json release/server/package.json
          cp client/package.json release/client-package.json
          cp -R client/dist/. release/client-dist
          cp docker-compose.yml release/docker-compose.yml
          cp README.md release/README.md

      - name: Zip output
        run: |
          cd release
          zip -r ../release_${{ github.ref_name }}.zip .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          name: ${{ github.ref_name }}
          artifacts: release_${{ github.ref_name }}.zip
          body: |
            Automated release of version ${{ github.ref_name }}

            Includes the runnable application bundle and the published container image:
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
