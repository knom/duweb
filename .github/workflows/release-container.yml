name: Release Container

on:
  push:
    tags:
      - "v*.*"

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match required format vX.Y"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Run unified checks
        run: npm run check

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Assemble release bundle
        run: |
          mkdir -p release/server release/client-dist
          cp -R server/dist release/server/dist
          cp -R server/node_modules release/server/node_modules
          cp server/package.json release/server/package.json
          cp client/package.json release/client-package.json
          cp -R client/dist/. release/client-dist
          cp docker-compose.yml release/docker-compose.yml
          cp README.md release/README.md

      - name: Zip output
        run: |
          cd release
          zip -r ../release_${{ github.ref_name }}.zip .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          artifacts: release_${{ github.ref_name }}.zip
          body: |
            Automated release of version ${{ github.ref_name }}

            Includes the runnable application bundle and the published container image:
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
