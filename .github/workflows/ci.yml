name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Run unit test coverage
        run: npm run coverage:unit

      - name: Run end-to-end tests
        run: npm run test:e2e --prefix client

      - name: Test coverage merging
        run: node --test scripts/merge-coverage.test.mjs

      - name: Merge coverage reports
        run: node scripts/merge-coverage.mjs

      - name: Build container on pull requests
        if: github.event_name == 'pull_request'
        run: docker build -t duweb-ci .

      - name: Prepare badge values
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: coverage
        run: |
          node -e "const {pct, covered, total} = require('./coverage/coverage-summary.json').total.statements; console.log('status=' + pct + '% (' + covered + '/' + total + ')'); console.log('color=' + (Number(pct) >= 60 ? '31c653' : '800000'))" >> "$GITHUB_OUTPUT"

      - name: Create coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: emibcn/badge-action@f9150fde070fcca0c4e832437611b44838fcd325 # v2.0.4
        with:
          label: Tests
          status: ${{ steps.coverage.outputs.status }}
          color: ${{ steps.coverage.outputs.color }}
          path: coverage.svg

      - name: Upload coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-badge
          path: coverage.svg
          if-no-files-found: error

  publish-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download coverage badge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage-badge

      - name: Commit badge to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          badge_ref=$(git ls-remote --heads origin refs/heads/badges)
          if [ -n "$badge_ref" ]; then
            git fetch origin badges:refs/remotes/origin/badges
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . --quiet
          fi
          cp "$RUNNER_TEMP/coverage-badge/coverage.svg" coverage.svg
          git add coverage.svg
          git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
          git push origin badges
