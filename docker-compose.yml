services:
  redis:
    image: redis:7-alpine
    container_name: duweb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  duweb:
    image: knom/duweb:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: /duweb
    environment:
      NODE_ENV: production
      PORT: 8080
      BASE_PATH: /duweb
      REDIS_URL: redis://redis:6379
      # Auth: set REQUIRE_AUTH=true to reject requests missing username/groups headers.
      # REQUIRE_AUTH: "false"
      # Optional: require user to be a member of a specific group (only used if REQUIRE_AUTH=true)
      # REQUIRE_AUTH_GROUP: "diskusage-admins"
      # Override the proxy header names read for each auth field (username and groups are required for auth):
      # AUTH_HEADER_USERNAME: x-forwarded-user
      # AUTH_HEADER_GROUPS: x-forwarded-groups
      # AUTH_HEADER_EMAIL: x-forwarded-email
      # AUTH_HEADER_NAME: x-forwarded-name
      # AUTH_HEADER_UID: x-forwarded-uid
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./data/:/app/server/data
      - /mnt/files/:/mnt/files/
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/duweb/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  duweb-data:
  redis-data:
