<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DiskUsage Web Icon</title>
  <desc id="desc">A large disk usage chart with web grid lines and a small fox mascot accent.</desc>

  <defs>
    <radialGradient id="disk" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(230 210) rotate(45) scale(260)">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="sliceA" x1="256" y1="70" x2="430" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="sliceB" x1="98" y1="286" x2="300" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sliceC" x1="70" y1="228" x2="214" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="diskClip">
      <circle cx="256" cy="268" r="178"/>
    </clipPath>
    <filter id="shadow" x="40" y="46" width="432" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.24"/>
    </filter>
    <filter id="foxShadow" x="292" y="30" width="206" height="206" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.24"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="256" cy="268" r="178" fill="url(#disk)"/>

    <g clip-path="url(#diskClip)">
      <path d="M256 268L256 90C354.307 90 434 169.693 434 268H256Z" fill="url(#sliceA)"/>
      <path d="M256 268L98 348C66.3084 285.409 66.3084 210.591 98 148L256 268Z" fill="url(#sliceC)"/>
      <path d="M256 268L308 438C231.046 461.716 149.995 426.859 111.5 356.5L256 268Z" fill="url(#sliceB)"/>

      <g stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="8">
        <path d="M78 268H434"/>
        <path d="M256 90V446"/>
        <path d="M122 164C161 199 188 233 203 268C188 303 161 337 122 372"/>
        <path d="M390 164C351 199 324 233 309 268C324 303 351 337 390 372"/>
        <path d="M164 124C199 163 233 190 268 205C303 190 337 163 372 124"/>
        <path d="M164 412C199 373 233 346 268 331C303 346 337 373 372 412"/>
      </g>
    </g>

    <circle cx="256" cy="268" r="178" stroke="#94A3B8" stroke-width="5"/>
    <circle cx="256" cy="268" r="26" fill="#0F172A" fill-opacity="0.9"/>
    <circle cx="256" cy="268" r="10" fill="#F8FAFC"/>
  </g>

  <g>
    <rect x="332" y="344" width="30" height="88" rx="8" fill="#0F172A" fill-opacity="0.88"/>
    <rect x="370" y="308" width="30" height="124" rx="8" fill="#0F172A" fill-opacity="0.88"/>
    <rect x="408" y="268" width="30" height="164" rx="8" fill="#0F172A" fill-opacity="0.88"/>
  </g>

</svg>
